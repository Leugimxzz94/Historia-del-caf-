<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Historia del Café</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f5f1;
    }

    .pagina {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    .imagen {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    /* IMAGEN FINAL */
    .final {
      position: relative;
      width: 100%;
      line-height: 0;
    }

    /*
      BOTONES INVISIBLES SOBRE LOS BOTONES
      DE INSTAGRAM Y FACEBOOK DE LA IMAGEN FINAL
    */

    .boton-instagram,
    .boton-facebook {
      position: absolute;
      display: block;
      height: 8%;
      top: 63%;
      background: transparent;
      z-index: 10;
    }

    .boton-instagram {
      left: 9%;
      width: 38%;
    }

    .boton-facebook {
      left: 51%;
      width: 38%;
    }

    /* AUDIO */

    .audio {
      background: #f7f5f1;
      text-align: center;
      padding: 25px 20px 30px;
    }

    .audio button {
      border: none;
      border-radius: 30px;
      padding: 14px 28px;
      background: #292929;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .audio p {
      margin: 10px 0 0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="pagina">

    <!-- IMAGEN 1 -->
    <img
      class="imagen"
      src="C4DA13F8-8763-496B-9D5A-E0477E1975A7.png"
      alt="Historia del café"
    >

    <!-- IMAGEN 2 -->
    <img
      class="imagen"
      src="1F871C37-53A1-4F07-9521-0391454A9210.png"
      alt="Historia del café"
    >

    <!-- IMAGEN 3 -->
    <img
      class="imagen"
      src="F902A271-1DA8-4FF3-927F-0D1D3D9AD901.png"
      alt="Historia del café"
    >

    <!-- IMAGEN 4 -->
    <img
      class="imagen"
      src="3AFA15B5-2B88-4B61-9887-5351BED8F93E.png"
      alt="Historia del café"
    >

    <!-- IMAGEN 5 -->
    <img
      class="imagen"
      src="CEA7B72F-328D-4822-8FF8-C70AEE86CB53.png"
      alt="Historia del café"
    >

    <!-- AUDIO -->
    <div class="audio">

      <button onclick="reproducirMusica()">
        ▶ Escuchar la historia
      </button>

      <p>
        Una pequeña melodía para acompañar este momento.
      </p>

      <audio id="musica" loop>
        <source src="Instrumental.mp3" type="audio/mpeg">
      </audio>

    </div>


    <!-- IMAGEN 6 / FINAL -->
    <div class="final">

      <img
        class="imagen"
        src="146E6F04-A3B3-4B32-93B3-F5CC1D8B4A02.png"
        alt="Gracias por ser parte de nuestra historia"
      >

      <!-- INSTAGRAM -->
      <a
        class="boton-instagram"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram">
      </a>

      <!-- FACEBOOK -->
      <a
        class="boton-facebook"
        href="https://www.facebook.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook">
      </a>

    </div>

  </main>


  <script>

    function reproducirMusica() {

      const musica = document.getElementById("musica");

      if (musica.paused) {
        musica.play();
      } else {
        musica.pause();
      }

    }

  </script>

</body>
</html>
