<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Historia del Café</title>

<style>
body {
  margin: 0;
  background: #f7f1e8;
  color: #5c4033;
  font-family: Arial, sans-serif;
  text-align: center;
}

.contenedor {
  max-width: 600px;
  margin: auto;
}

img {
  width: 100%;
  display: block;
}

.musica {
  padding: 25px 15px;
  background: #f7f1e8;
}

.boton-musica {
  background: #8b4b38;
  color: white;
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  font-size: 17px;
  cursor: pointer;
}

.redes {
  display: none;
  padding: 35px 20px 45px;
  background: #f7f1e8;
}

.redes h2 {
  margin: 0 0 16px;
  font-family: Georgia, serif;
  font-weight: normal;
  font-size: 31px;
  color: #8b4b38;
  font-style: italic;
}

.corazon {
  font-family: Georgia, serif;
  font-style: normal;
  font-size: 29px;
  color: #8b4b38;
}

.indicacion-redes {
  margin-top: 0;
  margin-bottom: 25px;
  color: #8b4b38;
  font-family: Georgia, serif;
  font-size: 17px;
  font-style: italic;
}

.indicacion-redes span {
  display: inline;
  font-family: Georgia, serif;
  font-size: 21px;
  font-style: normal;
  margin-left: 4px;
  color: #8b4b38;
}

.boton-red {
  display: none;
  text-decoration: none;
  color: white;
  background: #8b4b38;
  padding: 13px 22px;
  margin: 8px;
  border-radius: 25px;
  font-size: 16px;
}

.configurador {
  display: none;
  padding: 30px 20px;
  background: white;
  text-align: left;
}

.configurador h2 {
  text-align: center;
  color: #8b4b38;
  font-family: Georgia, serif;
}

.configurador label {
  display: block;
  margin-top: 18px;
  margin-bottom: 6px;
  font-weight: bold;
}

.configurador input {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 15px;
}

.boton-generar {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  background: #8b4b38;
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 17px;
}

.resultado {
  margin-top: 20px;
  padding: 15px;
  background: #f7f1e8;
  border-radius: 10px;
  word-break: break-all;
}

.codigo {
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="contenedor">

  <!-- MÚSICA -->
  <div class="musica">
    <button class="boton-musica" onclick="toggleMusica()">
      ▶ Escuchar la historia
    </button>

    <audio id="audio" loop>
      <source src="Instrumental.mp3" type="audio/mpeg">
    </audio>
  </div>


  <!-- HISTORIA -->
  <img src="C4DA13F8-8763-496B-9D5A-E0477E1975A7.png">
  <img src="1F871C37-53A1-4F07-9521-0391454A9210.png">
  <img src="F902A271-1DA8-4FF3-927F-0D1D3D9AD901.png">
  <img src="3AFA15B5-2B88-4B61-9887-5351BED8F93E.png">
  <img src="CEA7B72F-328D-4822-8FF8-C70AEE86CB53.png">


  <!-- IMAGEN FINAL -->
  <img src="8AB35F0D-65AE-49B2-A53F-00F379FF27AB.png">


  <!-- REDES SOCIALES -->
  <div class="redes" id="redes">

    <h2>
      Síguenos <span class="corazon">♡</span>
    </h2>

    <div class="indicacion-redes">
      Haz clic aquí <span>↓</span>
    </div>

    <a id="instagram" class="boton-red" target="_blank">
      Instagram
    </a>

    <a id="facebook" class="boton-red" target="_blank">
      Facebook
    </a>

    <a id="tiktok" class="boton-red" target="_blank">
      TikTok
    </a>

  </div>


  <!-- CONFIGURADOR -->
  <div class="configurador" id="configurador">

    <h2>Configurador de cafetería</h2>

    <label>Instagram</label>
    <input
      id="inputInstagram"
      type="url"
      placeholder="https://www.instagram.com/..."
    >

    <label>Facebook</label>
    <input
      id="inputFacebook"
      type="url"
      placeholder="https://www.facebook.com/..."
    >

    <label>TikTok</label>
    <input
      id="inputTiktok"
      type="url"
      placeholder="https://www.tiktok.com/@..."
    >

    <button class="boton-generar" onclick="generarCafe()">
      Generar enlace NFC
    </button>

    <div id="resultado" class="resultado" style="display:none;"></div>

  </div>

</div>


<script>

/* =====================================================
   CAFETERÍAS

   Cada letra representa una cafetería.
   Aquí guardaremos sus redes sociales.
   ===================================================== */

const CAFES = {

  "a": {
    instagram: "",
    facebook: "",
    tiktok: ""
  },

  "b": {
    instagram: "",
    facebook: "",
    tiktok: ""
  },

  "c": {
    instagram: "",
    facebook: "",
    tiktok: ""
  }

};


/* =====================================================
   MÚSICA
   ===================================================== */

function toggleMusica() {

  const audio = document.getElementById("audio");
  const boton = document.querySelector(".boton-musica");

  if (audio.paused) {

    audio.play();

    boton.innerHTML = "❚❚ Pausar la historia";

  } else {

    audio.pause();

    boton.innerHTML = "▶ Escuchar la historia";

  }

}


/* =====================================================
   MOSTRAR REDES
   ===================================================== */

function mostrarRedes(cafe) {

  if (!cafe) return;

  let hayRedes = false;

  if (cafe.instagram) {

    const boton = document.getElementById("instagram");

    boton.href = cafe.instagram;
    boton.style.display = "inline-block";

    hayRedes = true;

  }

  if (cafe.facebook) {

    const boton = document.getElementById("facebook");

    boton.href = cafe.facebook;
    boton.style.display = "inline-block";

    hayRedes = true;

  }

  if (cafe.tiktok) {

    const boton = document.getElementById("tiktok");

    boton.href = cafe.tiktok;
    boton.style.display = "inline-block";

    hayRedes = true;

  }

  if (hayRedes) {

    document.getElementById("redes").style.display = "block";

  }

}


/* =====================================================
   CONFIGURADOR
   ===================================================== */

function generarCafe() {

  const instagram =
    document.getElementById("inputInstagram").value.trim();

  const facebook =
    document.getElementById("inputFacebook").value.trim();

  const tiktok =
    document.getElementById("inputTiktok").value.trim();


  /*
    Para esta primera cafetería utilizaremos "a".
  */

  const codigo = "a";


  const enlace =
    "https://leugimxzz94.github.io/h/?c=" + codigo;


  const resultado =
    document.getElementById("resultado");


  resultado.style.display = "block";

  resultado.innerHTML =

    "<strong>Enlace NFC:</strong><br><br>" +

    enlace +

    "<br><br>" +

    "<div class='codigo'>" +

    "Código: " + codigo +

    "</div>" +

    "<br>" +

    "⚠️ Las redes introducidas deben agregarse a la configuración de esta cafetería antes de utilizar el NFC.";

}


/* =====================================================
   DETECTAR CAFETERÍA
   ===================================================== */

const parametros = new URLSearchParams(window.location.search);

const codigoCafe = parametros.get("c");


/*
   Si la URL contiene ?c=a,
   buscamos la cafetería "a".
*/

if (codigoCafe && CAFES[codigoCafe]) {

  mostrarRedes(CAFES[codigoCafe]);

}


/*
   Mostrar configurador solamente con ?config=1
*/

if (parametros.get("config") === "1") {

  document.getElementById("configurador").style.display = "block";

}

</script>

</body>
</html>
