<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>La historia del café</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f1eb;
      font-family: Arial, sans-serif;
      color: #2b2622;
    }

    .pagina {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      background: #f5f1eb;
    }

    .imagen {
      width: 100%;
      display: block;
    }


    /* =========================
       MÚSICA
       ========================= */

    .musica {
      padding: 28px 20px 30px;
      text-align: center;
      background: #f5f1eb;
    }

    .boton-musica {
      border: none;
      background: #292929;
      color: white;
      padding: 17px 34px;
      border-radius: 40px;
      font-size: 18px;
      cursor: pointer;
    }

    .boton-musica:active {
      transform: scale(0.98);
    }

    .texto-musica {
      margin-top: 18px;
      color: #888;
      font-size: 16px;
    }

    audio {
      display: none;
    }


    /* =========================
       REDES SOCIALES
       ========================= */

    .redes {
      display: none;
      padding: 30px 20px 40px;
      text-align: center;
      background: #f5f1eb;
    }

    .redes h2 {
      margin: 0 0 16px;
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 31px;
      color: #8b4b38;
      font-style: italic;
    }

    .corazon {
      font-family: Georgia, serif;
      font-style: normal;
      font-size: 29px;
      color: #8b4b38;
    }

    .indicacion-redes {
      margin-top: 0;
      margin-bottom: 25px;
      color: #8b4b38;
      font-family: Georgia, serif;
      font-size: 17px;
      font-style: italic;
    }

    .indicacion-redes span {
      display: inline;
      font-family: Georgia, serif;
      font-size: 21px;
      font-style: normal;
      margin-left: 4px;
      color: #8b4b38;
    }

    .botones-redes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 360px;
      margin: 0 auto;
    }

    .red-social {
      display: none;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: white;
      padding: 15px 20px;
      border-radius: 30px;
      font-size: 17px;
      font-weight: 500;
    }

    .instagram {
      background: #8b4b38;
    }

    .facebook {
      background: #4d5963;
    }

    .tiktok {
      background: #292929;
    }


    /* =========================
       CONFIGURADOR
       ========================= */

    .configuracion {
      display: none;
      padding: 25px 20px 40px;
      background: #eee8df;
    }

    .configuracion h2 {
      font-family: Georgia, serif;
      font-weight: normal;
      font-size: 28px;
      margin-top: 0;
    }

    .campo {
      margin-bottom: 18px;
    }

    .campo label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .campo input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    .generar {
      width: 100%;
      border: none;
      background: #292929;
      color: white;
      padding: 16px;
      border-radius: 30px;
      font-size: 17px;
      margin-top: 10px;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      word-break: break-all;
      font-size: 14px;
    }

    .copiar {
      width: 100%;
      border: none;
      background: #8b4b38;
      color: white;
      padding: 13px;
      border-radius: 25px;
      margin-top: 12px;
      font-size: 16px;
    }

  </style>

</head>


<body>

  <main class="pagina">


    <!-- =========================
         MÚSICA
         ========================= -->

    <section class="musica">

      <button
        class="boton-musica"
        id="botonMusica">

        ▶ Escuchar la historia

      </button>


      <div class="texto-musica">

        Una pequeña melodía para acompañar este momento.

      </div>


      <audio id="musica" loop>

        <source
          src="Instrumental.mp3"
          type="audio/mpeg">

      </audio>

    </section>



    <!-- =========================
         IMAGEN 1
         ========================= -->

    <img
      class="imagen"
      src="C4DA13F8-8763-496B-9D5A-E0477E1975A7.png"
      alt="La historia del café">



    <!-- =========================
         IMAGEN 2
         ========================= -->

    <img
      class="imagen"
      src="1F871C37-53A1-4F07-9521-0391454A9210.png"
      alt="La historia del café">



    <!-- =========================
         IMAGEN 3
         ========================= -->

    <img
      class="imagen"
      src="F902A271-1DA8-4FF3-927F-0D1D3D9AD901.png"
      alt="La historia del café">



    <!-- =========================
         IMAGEN 4
         ========================= -->

    <img
      class="imagen"
      src="3AFA15B5-2B88-4B61-9887-5351BED8F93E.png"
      alt="La historia del café">



    <!-- =========================
         IMAGEN 5
         ========================= -->

    <img
      class="imagen"
      src="CEA7B72F-328D-4822-8FF8-C70AEE86CB53.png"
      alt="La historia del café">



    <!-- =========================
         IMAGEN FINAL
         ========================= -->

    <img
      class="imagen"
      src="8AB35F0D-65AE-49B2-A53F-00F379FF27AB.png"
      alt="Gracias por ser parte de esta historia">



    <!-- =========================
         REDES SOCIALES
         ========================= -->

    <section
      class="redes"
      id="redes">


      <h2>

        Síguenos <span class="corazon">♡</span>

      </h2>


      <div class="indicacion-redes">

        Haz clic aquí <span>↓</span>

      </div>


      <div class="botones-redes">


        <a
          id="instagram"
          class="red-social instagram"
          href="#"
          target="_blank"
          rel="noopener">

          Instagram

        </a>


        <a
          id="facebook"
          class="red-social facebook"
          href="#"
          target="_blank"
          rel="noopener">

          Facebook

        </a>


        <a
          id="tiktok"
          class="red-social tiktok"
          href="#"
          target="_blank"
          rel="noopener">

          TikTok

        </a>


      </div>

    </section>



    <!-- =========================
         CONFIGURADOR
         ========================= -->

    <section
      class="configuracion"
      id="configuracion">


      <h2>

        Configurar cafetería

      </h2>


      <div class="campo">

        <label for="instagramInput">

          Instagram

        </label>


        <input
          id="instagramInput"
          type="url"
          placeholder="https://instagram.com/cafeteria">

      </div>



      <div class="campo">

        <label for="facebookInput">

          Facebook

        </label>


        <input
          id="facebookInput"
          type="url"
          placeholder="https://facebook.com/cafeteria">

      </div>



      <div class="campo">

        <label for="tiktokInput">

          TikTok

        </label>


        <input
          id="tiktokInput"
          type="url"
          placeholder="https://tiktok.com/@cafeteria">

      </div>



      <button
        class="generar"
        onclick="generarEnlace()">

        Generar enlace de esta cafetería

      </button>



      <div id="resultado">

        <strong>

          Enlace generado:

        </strong>


        <br>
        <br>


        <span id="enlaceGenerado"></span>


        <button
          class="copiar"
          onclick="copiarEnlace()">

          Copiar enlace

        </button>

      </div>


    </section>


  </main>



  <script>


    /* =========================
       MÚSICA
       ========================= */

    const botonMusica =
      document.getElementById("botonMusica");

    const musica =
      document.getElementById("musica");


    botonMusica.addEventListener(
      "click",
      function() {


        if (musica.paused) {

          musica.play();

          botonMusica.textContent =
            "❚❚ Pausar la historia";

        }

        else {

          musica.pause();

          botonMusica.textContent =
            "▶ Escuchar la historia";

        }

      }
    );



    /* =========================
       REDES SOCIALES
       ========================= */

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const instagramURL =
      parametros.get("instagram");


    const facebookURL =
      parametros.get("facebook");


    const tiktokURL =
      parametros.get("tiktok");


    let hayRedes = false;



    if (instagramURL) {

      const instagram =
        document.getElementById("instagram");


      instagram.href =
        instagramURL;


      instagram.style.display =
        "flex";


      hayRedes = true;

    }



    if (facebookURL) {

      const facebook =
        document.getElementById("facebook");


      facebook.href =
        facebookURL;


      facebook.style.display =
        "flex";


      hayRedes = true;

    }



    if (tiktokURL) {

      const tiktok =
        document.getElementById("tiktok");


      tiktok.href =
        tiktokURL;


      tiktok.style.display =
        "flex";


      hayRedes = true;

    }



    if (hayRedes) {

      document.getElementById("redes")
        .style.display = "block";

    }



    /* =========================
       MOSTRAR CONFIGURADOR
       ========================= */

    if (
      parametros.get("config") === "1"
    ) {

      document.getElementById(
        "configuracion"
      ).style.display = "block";

    }



    /* =========================
       GENERAR ENLACE
       ========================= */

    function generarEnlace() {


      const instagram =
        document.getElementById(
          "instagramInput"
        ).value.trim();


      const facebook =
        document.getElementById(
          "facebookInput"
        ).value.trim();


      const tiktok =
        document.getElementById(
          "tiktokInput"
        ).value.trim();



      const baseURL =
        window.location.origin +
        window.location.pathname;



      const nuevoURL =
        new URL(baseURL);



      if (instagram) {

        nuevoURL.searchParams.set(
          "instagram",
          instagram
        );

      }



      if (facebook) {

        nuevoURL.searchParams.set(
          "facebook",
          facebook
        );

      }



      if (tiktok) {

        nuevoURL.searchParams.set(
          "tiktok",
          tiktok
        );

      }



      const resultado =
        document.getElementById(
          "resultado"
        );


      const enlace =
        document.getElementById(
          "enlaceGenerado"
        );


      enlace.textContent =
        nuevoURL.toString();


      resultado.style.display =
        "block";

    }



    /* =========================
       COPIAR ENLACE
       ========================= */

    function copiarEnlace() {


      const enlace =
        document.getElementById(
          "enlaceGenerado"
        ).textContent;


      navigator.clipboard.writeText(
        enlace
      );


      document.querySelector(
        ".copiar"
      ).textContent =
        "✓ Enlace copiado";

    }


  </script>


</body>

</html>
